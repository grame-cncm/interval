name: Ubuntu

on:
  push:
    branches: 
      - '*'
  pull_request:
    branches: 
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: create cmake project
      run: cmake -B build -S .
    - name: build cmake project
      run: cmake --build build/ --target all
    - name: execute tests
      run: ctest --test-dir build --output-on-failure
